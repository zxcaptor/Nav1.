<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GHOSTLINE">
<meta name="theme-color" content="#0a1016">
<title>GHOSTLINE NAV</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<script>
/* Показываем настоящую причину ошибки прямо на экране */
(function(){
  function box(){var b=document.getElementById('fatal');if(b)return b;b=document.createElement('div');b.id='fatal';
    b.style.cssText='position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:9999;background:#c8414f;color:#fff;font:600 14px/1.35 monospace;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto';
    (document.body||document.documentElement).appendChild(b);return b;}
  window.showFatal=function(t){var b=box();b.textContent+=(b.textContent?'\n\n':'')+t;};
  window.addEventListener('error',function(e){window.showFatal('ОШИБКА: '+(e.message||'?')+(e.filename?'\n'+e.filename.split('/').pop()+':'+e.lineno:''));});
  window.addEventListener('unhandledrejection',function(e){window.showFatal('ОШИБКА (promise): '+(e.reason&&e.reason.message||e.reason));});
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous">
<style>
:root{
  --y:#f5e663; --c:#6ee8de; --r:#c8414f; --bg:#0a1016; --pan:rgba(11,19,25,.95); --ln:#8d4650; --dim:#6b9aa0;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --cut:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--c);font-family:'Rajdhani',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
button{font-family:inherit;cursor:pointer}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{background:rgba(10,16,22,.75)!important;color:#5f868c!important;font-size:9px!important}
.maplibregl-ctrl-attrib a{color:#5f868c!important}
.maplibregl-ctrl-bottom-right{display:none}
.maplibregl-ctrl-bottom-left{left:0;bottom:calc(var(--sb) + 2px)}
body:not([data-mode=idle]) .maplibregl-ctrl-bottom-left{display:none}

/* рамка экрана как в референсе */
.frame{position:fixed;inset:5px;border:1px solid rgba(200,65,79,.55);pointer-events:none;z-index:50}
.frame::before,.frame::after{content:'';position:absolute;width:18px;height:18px;border:2px solid #c8414f}
.frame::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.frame::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
#horizon{position:fixed;left:0;right:0;top:0;height:22%;pointer-events:none;z-index:5;opacity:0;transition:opacity .5s;
  background:linear-gradient(180deg,#0a1016 0%,rgba(10,16,22,.8) 35%,rgba(10,16,22,0) 100%)}
body[data-mode=nav] #horizon{opacity:1}

/* панель со срезанными углами и тонкой рамкой */
.panel{position:relative;isolation:isolate}
.panel::before{content:'';position:absolute;inset:0;background:var(--ln);clip-path:var(--cut);z-index:-2}
.panel::after{content:'';position:absolute;inset:1px;background:var(--pan);clip-path:var(--cut);z-index:-1}

/* верх: поиск */
#top{position:fixed;left:14px;right:14px;top:calc(var(--st) + 12px);z-index:20}
body[data-mode=preview] #top,body[data-mode=nav] #top{display:none}
#status{display:flex;align-items:center;gap:8px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.14em;margin:0 4px 6px;text-shadow:0 0 6px rgba(0,0,0,.9)}
.logo{font-weight:700;font-family:'Rajdhani';font-size:17px;letter-spacing:.2em;color:var(--y)}
.sep{color:var(--r)}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;overflow:hidden;width:100%}
.glitch::before{color:var(--c);transform:translateX(-2px);animation:g1 3.2s infinite steps(1)}
.glitch::after{color:var(--r);transform:translateX(2px);animation:g2 2.6s infinite steps(1)}
@keyframes g1{0%,88%{clip-path:inset(0 0 100% 0)}90%{clip-path:inset(15% 0 55% 0)}93%{clip-path:inset(60% 0 10% 0)}96%,100%{clip-path:inset(0 0 100% 0)}}
@keyframes g2{0%,80%{clip-path:inset(0 0 100% 0)}83%{clip-path:inset(50% 0 20% 0)}86%{clip-path:inset(5% 0 75% 0)}89%,100%{clip-path:inset(0 0 100% 0)}}

#searchWrap{display:flex;align-items:center;height:54px;padding-left:16px}
#q{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--c);font:600 19px 'Rajdhani';letter-spacing:.06em}
#q::placeholder{color:#4d7c82}
#clr{background:none;border:0;color:var(--c);font:700 18px 'Rajdhani';width:50px;height:54px;display:none}
#results{list-style:none;margin:8px 0 0;padding:6px 0;max-height:46vh;overflow:auto;display:none}
#results li{padding:11px 16px;border-bottom:1px solid rgba(110,232,222,.12)}
#results li:last-child{border-bottom:0}
#results li:active{background:rgba(245,230,99,.12)}
#results .n{color:var(--c);font-weight:700;font-size:19px;letter-spacing:.03em}
#results .s{color:#7d9ea3;font-size:14px;margin-top:1px}
#results .none{color:#7d9ea3;font-family:'Share Tech Mono',monospace;font-size:13px}

/* верхняя панель маршрута */
#routebar{position:fixed;left:14px;right:14px;top:calc(var(--st) + 12px);z-index:20;display:none;align-items:center;height:68px;padding:0 10px}
body[data-mode=preview] #routebar{display:flex}
#back{background:none;border:0;color:var(--c);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 13px 'Rajdhani';letter-spacing:.04em;width:64px;padding:4px 0}
#back svg{width:26px;height:26px}
#routebar .ttl{flex:1;text-align:center;font:700 24px 'Rajdhani';letter-spacing:.16em;color:var(--c);margin-right:64px}

/* маневр + полосы */
#maneuver{position:fixed;left:14px;right:14px;top:calc(var(--st) + 12px);z-index:20;display:none;padding:12px 16px}
body[data-mode=nav] #maneuver{display:block}
.mrow{display:flex;align-items:center;gap:14px}
#mIcon{width:64px;height:64px;color:var(--y);filter:drop-shadow(0 0 8px rgba(245,230,99,.45));flex:none}
#mIcon svg{width:100%;height:100%;transition:transform .3s}
#mDist{font:700 40px/1 'Rajdhani';color:var(--y);text-shadow:0 0 12px rgba(245,230,99,.4)}
#mText{font:600 20px/1.1 'Rajdhani';color:#fff;letter-spacing:.03em;margin-top:2px}
#mStreet{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--c);margin-top:3px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
#lanes{display:none;justify-content:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(141,70,80,.7)}
#lanes.show{display:flex}
.lane{width:38px;height:48px;border-left:1px dashed rgba(110,232,222,.35)}
.lane:last-child{border-right:1px dashed rgba(110,232,222,.35)}
.lane svg{width:100%;height:100%;display:block}

/* кнопки */
.btn{width:100%;font:700 21px 'Rajdhani';letter-spacing:.06em;border:0;height:54px;color:#04181a;background:var(--c);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.btn:active{background:#fff}
.btn.danger{background:rgba(200,65,79,.18);color:#ff8e99;box-shadow:inset 0 0 0 2px var(--r);width:auto;padding:0 18px;height:58px;font-size:20px;clip-path:none}

#side{position:fixed;right:14px;bottom:calc(var(--sb) + var(--stack,0px) + 14px);z-index:20;display:flex;flex-direction:column;gap:10px;transition:bottom .2s}
.sb{width:54px;height:50px;background:var(--pan);color:var(--c);border:0;font:700 13px 'Share Tech Mono',monospace;letter-spacing:.06em;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:inset 0 0 0 1px var(--ln);position:relative}
.sb:active{background:rgba(110,232,222,.25)}
.sb.on{color:#04181a;background:var(--y)}
.sb.off{color:#5f868c;text-decoration:line-through}
#loc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:58px}
#loc svg{width:28px;height:28px}
#locTag{font:700 10px 'Share Tech Mono',monospace;height:11px;line-height:11px}
body[data-mode=nav][data-track=off] #loc{animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:rgba(245,230,99,.4)}}

#chip{position:fixed;left:14px;bottom:calc(var(--sb) + var(--stack,0px) + 14px);z-index:20;font:12px 'Share Tech Mono',monospace;letter-spacing:.1em;color:#7d9ea3;
  background:var(--pan);padding:6px 11px;box-shadow:inset 0 0 0 1px var(--ln);transition:bottom .2s}
#chip.ok{color:var(--c)}
body[data-mode=nav] #chip{display:none}

/* карточка маршрута и HUD */
#preview,#hud{position:fixed;left:14px;right:14px;bottom:calc(var(--sb) + 14px);z-index:20;display:none;padding:16px 18px 18px}
body[data-mode=preview] #preview{display:block}
body[data-mode=nav] #hud{display:flex;align-items:center;gap:14px;padding:12px 14px}
.drow{display:flex;align-items:center;gap:14px}
.pin{width:54px;height:54px;flex:none;background:rgba(245,230,99,.14);display:flex;align-items:center;justify-content:center;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}
.pin svg{width:26px;height:26px}
.dn{min-width:0;flex:1}
#pName{font:700 26px/1.1 'Rajdhani';color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pSub{font:500 16px 'Rajdhani';color:#7d9ea3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;align-items:baseline;gap:12px;margin:14px 0 14px}
#pMin{font:700 34px/1 'Rajdhani';color:var(--y);text-shadow:0 0 12px rgba(245,230,99,.3)}
#pKm{font:500 19px 'Rajdhani';color:#9bb7bb}
#pWarn{font:12px 'Share Tech Mono',monospace;color:#ff8e99;margin:-6px 0 12px;display:none}

#speedBox{text-align:center;min-width:78px}
#spd{font:700 54px/0.9 'Rajdhani';color:var(--y);text-shadow:0 0 14px rgba(245,230,99,.45)}
#spdU{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--c);letter-spacing:.2em}
#hudMid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
#hudMid .l{font:10px 'Share Tech Mono',monospace;color:#5f868c;letter-spacing:.18em}
#hudMid .v{font:700 24px 'Rajdhani';color:#fff;letter-spacing:.03em;white-space:nowrap}
#hudMid .v.cy{color:var(--c)}

/* маркеры */
.me{width:46px;height:46px;position:relative}
.me svg{position:absolute;inset:6px;width:34px;height:34px;filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 12px rgba(110,232,222,.7))}
.me i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);opacity:0;animation:ping 2s infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.3);opacity:0}}
.dest{width:34px;height:44px;filter:drop-shadow(0 0 8px rgba(245,230,99,.8))}
.dest svg{width:100%;height:100%}

#toast{position:fixed;left:50%;bottom:calc(var(--sb) + var(--stack,0px) + 84px);transform:translateX(-50%);z-index:60;background:rgba(200,65,79,.95);color:#fff;
  font:700 16px 'Rajdhani';letter-spacing:.1em;padding:9px 18px;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .25s;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);max-width:88vw;text-align:center}
#toast.show{opacity:1}

/* загрузочный экран */
#boot{position:fixed;inset:0;z-index:100;background:#070b10;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;
  font-family:'Share Tech Mono',monospace;color:var(--c);font-size:14px;line-height:2;letter-spacing:.08em;transition:opacity .5s}
#boot.hide{opacity:0;pointer-events:none}
#boot .t{color:var(--y);font:700 34px 'Rajdhani';letter-spacing:.3em;margin-bottom:14px;text-shadow:0 0 18px rgba(245,230,99,.5)}
#boot div.ln{opacity:0;animation:ln .01s forwards}
#boot div.ln:nth-of-type(1){animation-delay:.2s}#boot div.ln:nth-of-type(2){animation-delay:.6s}
#boot div.ln:nth-of-type(3){animation-delay:1s}#boot div.ln:nth-of-type(4){animation-delay:1.4s}
@keyframes ln{to{opacity:1}}
.okc{color:var(--y)}
</style>
</head>
<body data-mode="idle" data-track="off">
<div id="map"></div>
<div id="horizon"></div>
<div class="frame"></div>

<div id="boot" onclick="this.classList.add('hide')">
  <div class="t glitch" data-t="GHOSTLINE">GHOSTLINE</div>
  <div class="ln">&gt; NEURAL MAP ........ <span class="okc">OK</span></div>
  <div class="ln">&gt; SATELLITE LINK ... <span class="okc">OK</span></div>
  <div class="ln">&gt; ROUTE ENGINE .... <span class="okc">OK</span></div>
  <div class="ln">&gt; JACKING IN...</div>
</div>

<header id="top">
  <div id="status"><span class="logo glitch" data-t="GHOSTLINE">GHOSTLINE</span><span class="sep">//</span><span>NAV</span></div>
  <div id="searchWrap" class="panel">
    <input id="q" placeholder="Куда едем?" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button id="clr" aria-label="Очистить">✕</button>
  </div>
  <ul id="results" class="panel"></ul>
</header>

<div id="routebar" class="panel">
  <button id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>Назад</button>
  <div class="ttl">МАРШРУТ</div>
</div>

<div id="maneuver" class="panel">
  <div class="mrow">
    <div id="mIcon"></div>
    <div style="min-width:0">
      <div id="mDist">—</div>
      <div id="mText">—</div>
      <div id="mStreet"></div>
    </div>
  </div>
  <div id="lanes"></div>
</div>

<div id="chip">GPS ···</div>

<div id="side">
  <button class="sb" id="loc" aria-label="Моё местоположение">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="14" cy="14" r="7"/><circle cx="14" cy="14" r="2.2" fill="currentColor"/><path d="M14 2v5M14 21v5M2 14h5M21 14h5" stroke-linecap="round"/></svg>
    <span id="locTag"></span>
  </button>
  <button class="sb on" id="vox">VOX</button>
  <button class="sb" id="sim">SIM</button>
</div>

<footer id="preview" class="panel">
  <div class="drow">
    <div class="pin"><svg viewBox="0 0 24 24" fill="#f5e663"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg></div>
    <div class="dn"><div id="pName">—</div><div id="pSub"></div></div>
  </div>
  <div class="stat"><span id="pMin">—</span><span id="pKm"></span></div>
  <div id="pWarn"></div>
  <button class="btn" id="go">▲&nbsp; Начать навигацию</button>
</footer>

<footer id="hud" class="panel">
  <div id="speedBox"><div id="spd">0</div><div id="spdU">KM/H</div></div>
  <div id="hudMid">
    <div><div class="l">ПРИБЫТИЕ</div><div class="v" id="eta">--:--</div></div>
    <div><div class="l">ОСТАЛОСЬ</div><div class="v cy" id="rem">—</div></div>
  </div>
  <button class="btn danger" id="end">СТОП</button>
</footer>

<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script>
/* запасной источник библиотеки карты, если первый не ответил */
if(typeof maplibregl==='undefined'){document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></scr'+'ipt>');
document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous">');}
</script>
<script>
/* ============ СТИЛЬ КАРТЫ (по референсу: красные кварталы, бирюзовые дороги) ============ */
const C={bg:'#0a1016',y:'#f5e663',c:'#6ee8de'};
const wExpr=k=>['interpolate',['exponential',1.5],['zoom'],6,0.3*k,12,1.2*k,16,5*k,20,24*k];
const cls=(...a)=>['in',['get','class'],['literal',a]];
function road(id,classes,color,k,minzoom,extra={}){
  return {id,type:'line',source:'omt','source-layer':'transportation',minzoom,
    filter:cls(...classes),layout:{'line-cap':'round','line-join':'round'},
    paint:Object.assign({'line-color':color,'line-width':wExpr(k)},extra)};
}
const STYLE={
  version:8,
  glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources:{
    omt:{type:'vector',url:'https://tiles.openfreemap.org/planet',
      attribution:'<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'},
    route:{type:'geojson',data:{type:'FeatureCollection',features:[]}}
  },
  layers:[
    {id:'bg',type:'background',paint:{'background-color':C.bg}},
    {id:'landcover',type:'fill',source:'omt','source-layer':'landcover',paint:{'fill-color':'#0c1a1d','fill-opacity':.8}},
    {id:'landuse',type:'fill',source:'omt','source-layer':'landuse',filter:cls('residential','suburb','neighbourhood','commercial','industrial','retail'),paint:{'fill-color':'#0d161c'}},
    {id:'park',type:'fill',source:'omt','source-layer':'park',paint:{'fill-color':'#0b1d20','fill-opacity':.95}},
    {id:'water',type:'fill',source:'omt','source-layer':'water',paint:{'fill-color':'#050a0f'}},
    {id:'water-edge',type:'line',source:'omt','source-layer':'water',paint:{'line-color':C.c,'line-opacity':.3,'line-width':1}},
    {id:'waterway',type:'line',source:'omt','source-layer':'waterway',paint:{'line-color':'#0d3a44','line-width':1}},
    {id:'buildings',type:'fill-extrusion',source:'omt','source-layer':'building',minzoom:13.5,paint:{
      'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],6],0,'#6e1c28',20,'#8c2431',60,'#a82a3a',150,'#c2354a'],
      'fill-extrusion-height':['coalesce',['get','render_height'],6],
      'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
      'fill-extrusion-opacity':.95}},
    {id:'rail',type:'line',source:'omt','source-layer':'transportation',filter:cls('rail','transit'),minzoom:10,paint:{'line-color':'#2b4c58','line-width':1,'line-dasharray':[3,3]}},
    road('glow-major',['motorway','trunk','primary'],C.c,2.4,6,{'line-blur':6,'line-opacity':.16}),
    road('r-service',['service','track'],'#143841',.35,15),
    road('r-minor',['minor'],'#1d6370',.55,12.5),
    road('r-tertiary',['tertiary'],'#2a8593',.8,11),
    road('r-secondary',['secondary'],'#38a5b3',1,9),
    road('r-primary',['primary'],'#55c6d0',1.2,7),
    road('r-trunk',['trunk'],'#6ee8de',1.35,5),
    road('r-motorway',['motorway'],'#8ff3ea',1.5,4),
    road('r-path',['path','pedestrian'],'#1a3f47',.3,16,{'line-dasharray':[2,2]}),
    {id:'route-glow',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':C.y,'line-width':['interpolate',['linear'],['zoom'],8,8,18,34],'line-blur':10,'line-opacity':.45}},

const rad=Math.PI/180;
function hav(a,b){const dLat=(b[1]-a[1])*rad,dLng=(b[0]-a[0])*rad;const s=Math.sin(dLat/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin(dLng/2)**2;return 12742000*Math.asin(Math.sqrt(s));}
function bearing(a,b){const dl=(b[0]-a[0])*rad;const y=Math.sin(dl)*Math.cos(b[1]*rad);const x=Math.cos(a[1]*rad)*Math.sin(b[1]*rad)-Math.sin(a[1]*rad)*Math.cos(b[1]*rad)*Math.cos(dl);return (Math.atan2(y,x)/rad+360)%360;}
function fmtDist(m){if(m<1000)return(m<30?Math.round(m):Math.round(m/10)*10)+' м';return(m/1000).toFixed(m<10000?1:0)+' км';}
function fmtTime(s){const m=Math.max(1,Math.round(s/60));if(m<60)return m+' мин';return Math.floor(m/60)+' ч '+String(m%60).padStart(2,'0')+' мин';}

async function geocode(text){
  const c=map.getCenter();
  try{
    const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(text)}&limit=7&lat=${c.lat}&lon=${c.lng}`);
    const j=await r.json();
    const out=(j.features||[]).map(f=>{
      const p=f.properties||{};
      const street=p.street?(p.street+(p.housenumber?' '+p.housenumber:'')):'';
      const name=p.name||street||'Без названия';
      const sub=[p.name&&street?street:'',p.city||p.district||p.county,p.state,p.country].filter(Boolean).join(', ');
      return {name,sub,lng:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]};
    });
    if(out.length)return out;
  }catch(e){}
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&q=${encodeURIComponent(text)}`);
  const j=await r.json();
  return j.map(x=>{const parts=x.display_name.split(', ');return{name:parts[0],sub:parts.slice(1,4).join(', '),lng:+x.lon,lat:+x.lat};});
}

async function fetchRoute(from,to){
  const url=`https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson&steps=true`;
  const r=await fetch(url);const j=await r.json();
  if(j.code!=='Ok'||!j.routes.length)throw new Error('no route');
  const rt=j.routes[0];
  const out={coords:rt.geometry.coordinates,dist:rt.distance,dur:rt.duration,steps:rt.legs[0].steps,uid:++uidc,_ln:{}};
  out.cum=[0];for(let i=1;i<out.coords.length;i++)out.cum[i]=out.cum[i-1]+hav(out.coords[i-1],out.coords[i]);
  out.total=out.cum[out.cum.length-1];
  const sum=out.steps.reduce((a,s)=>a+s.distance,0)||1;const k=out.total/sum;
  let acc=0;out.stepStart=out.steps.map(s=>{const v=acc*k;acc+=s.distance;return v;});
  out.prog=0;
  return out;
}

/* ============ НАВИГАЦИЯ ============ */
const ANG={'uturn':180,'sharp right':135,'right':90,'slight right':45,'straight':0,'slight left':-45,'left':-90,'sharp left':-135};
const MOD={left:'налево',right:'направо','slight left':'левее','slight right':'правее','sharp left':'резко налево','sharp right':'резко направо',straight:'прямо'};
function instr(s){
  const m=s.maneuver,mod=m.modifier,t=m.type;
  const side=mod&&mod.includes('left')?'левее':'правее';
  if(t==='arrive')return 'Вы прибыли';
  if(t==='depart')return 'Начните движение';
  if(t==='roundabout'||t==='rotary'||t==='roundabout turn')return m.exit?`На кольце ${m.exit}-й съезд`:'Въезжайте на кольцо';
  if(t==='exit roundabout'||t==='exit rotary')return 'Съезжайте с кольца';
  if(mod==='uturn')return 'Развернитесь';
  if(t==='fork')return 'На развилке держитесь '+side;
  if(t==='merge')return 'Перестройтесь '+side;
  if(t==='on ramp'||t==='off ramp')return 'Съезд '+(MOD[mod]||'прямо');
  if(!mod||mod==='straight')return 'Продолжайте прямо';
  return 'Поверните '+MOD[mod];
}
function iconSVG(s){
  const m=s.maneuver,t=m.type;
  if(t==='arrive')return '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="24" cy="24" r="6" fill="currentColor"/></svg>';
  if(t==='roundabout'||t==='rotary'||t==='roundabout turn')return `<svg viewBox="0 0 48 48"><circle cx="24" cy="30" r="12" fill="none" stroke="currentColor" stroke-width="4"/><path d="M24 2 L35 15 H13Z" fill="currentColor"/><text x="24" y="35" text-anchor="middle" font-size="15" font-family="Rajdhani" font-weight="700" fill="currentColor">${m.exit||''}</text></svg>`;
  const a=ANG[m.modifier||'straight']??0;
  return `<svg viewBox="0 0 48 48" style="transform:rotate(${a}deg)"><path d="M24 3 L41 25 H29.5 V45 H18.5 V25 H7 Z" fill="currentColor"/></svg>`;
}

/* ---- полосы движения ---- */
/* OSRM отдаёт полосы в данных перекрёстка, если они есть в OpenStreetMap. Берём перекрёсток рядом с точкой манёвра. */
function lanesFor(i){
  const nxt=R.steps[i+1];if(!nxt||!nxt.maneuver)return null;
  const ml=nxt.maneuver.location;let best=null,bd=45;
  const scan=s=>((s&&s.intersections)||[]).forEach(it=>{
    if(!it.lanes||!it.lanes.length||!it.lanes.some(l=>l.valid))return;
    const d=hav(it.location,ml);if(d<bd){bd=d;best=it.lanes;}
  });
  scan(R.steps[i]);scan(nxt);
  return best;
}
function laneSVG(l,mod){
  const inds=(l.indications&&l.indications.length)?l.indications:['none'];
  const hi=l.valid?(l.valid_indication||(inds.includes(mod)?mod:null)):null;
  const items=inds.map(ind=>{
    const key=ind==='none'?'straight':ind;
    const a=ANG[key]??0;
    const on=l.valid&&(hi?ind===hi:true);
    return {a,on};
  }).sort((x,y)=>(x.on?1:0)-(y.on?1:0));
  const dim='#37535d',mid='#8fc4c9',hot='#f5e663';
  const stemCol=l.valid?hot:dim;
  const parts=items.map(it=>{
    const col=it.on?hot:l.valid?mid:dim;
    const glow=it.on?' style="filter:drop-shadow(0 0 3px #f5e663)"':'';
    return `<g transform="translate(12 18) rotate(${it.a})" stroke="${col}" fill="${col}"${glow}><line x1="0" y1="0" x2="0" y2="-8" stroke-width="3" stroke-linecap="round"/><polygon points="0,-15 -5.5,-8 5.5,-8" stroke="none"/></g>`;
  }).join('');
  return `<svg viewBox="0 0 24 34"><line x1="12" y1="31" x2="12" y2="18" stroke="${stemCol}" stroke-width="3" stroke-linecap="round"/>${parts}</svg>`;
}
let laneSig='';
function showLanes(dNext,nxt){
  const box=$('#lanes');
  if(!(state.idx in R._ln))R._ln[state.idx]=lanesFor(state.idx);
  const L=R._ln[state.idx];
  if(!L||dNext>900){box.classList.remove('show');laneSig='';return;}
  const sig=R.uid+':'+state.idx;
  if(sig!==laneSig){
    laneSig=sig;
    const mod=nxt.maneuver.modifier||'straight';
    box.innerHTML=L.map(l=>`<div class="lane">${laneSVG(l,mod)}</div>`).join('');
  }
  box.classList.add('show');
}

function project(p){
  const c=R.coords,X=111320*Math.cos(p[1]*rad),Y=110540;
  let best=1e15,bp=0;
  for(let i=0;i<c.length-1;i++){
    const ax=(c[i][0]-p[0])*X,ay=(c[i][1]-p[1])*Y,bx=(c[i+1][0]-p[0])*X,by=(c[i+1][1]-p[1])*Y;
    const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
    let t=l2?(-(ax*dx+ay*dy))/l2:0;t=Math.max(0,Math.min(1,t));
    const px=ax+t*dx,py=ay+t*dy,d=px*px+py*py;
    if(d<best){best=d;bp=R.cum[i]+t*(R.cum[i+1]-R.cum[i]);}
  }
  return {dist:Math.sqrt(best),prog:bp};
}

function updateNav(p){
  if(!R)return;
  const pr=project(p);
  if(pr.dist>70&&!state.sim&&!state.rerouting&&Date.now()-state.lastReroute>8000){reroute();}
  R.prog=pr.prog;
  const last=R.steps.length-1;
  while(state.idx<last&&pr.prog>=R.stepStart[state.idx+1]-(state.idx+1===last?25:12))state.idx++;
  if(state.idx>=last){arrived();return;}
  const nxt=R.steps[state.idx+1];
  const dNext=Math.max(0,R.stepStart[state.idx+1]-pr.prog);
  $('#mIcon').innerHTML=iconSVG(nxt);
  $('#mDist').textContent=fmtDist(dNext);
  $('#mText').textContent=instr(nxt);
  $('#mStreet').textContent=nxt.name?'▸ '+nxt.name:'';
  showLanes(dNext,nxt);
  const remain=Math.max(0,R.total-pr.prog);
  const remT=R.dur*(remain/R.total);
  $('#rem').textContent=fmtDist(remain);
  $('#eta').textContent=new Date(Date.now()+remT*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
  $('#spd').textContent=Math.round(state.speed*3.6);
  voice(nxt,dNext);
  if(state.track==='head')cam();
}
function voice(nxt,d){
  const key=l=>state.idx+':'+l;
  const name=nxt.name?' на '+nxt.name:'';
  const txt=instr(nxt).toLowerCase();
  if(d<=35){if(!state.spoken[key(0)]){state.spoken[key(0)]=state.spoken[key(1)]=state.spoken[key(2)]=1;say(instr(nxt)+name);}}
  else if(d<=130){if(!state.spoken[key(1)]){state.spoken[key(1)]=state.spoken[key(2)]=1;say('Через '+Math.round(d/10)*10+' метров '+txt+name);}}
  else if(d<=420){if(!state.spoken[key(2)]){state.spoken[key(2)]=1;say('Через '+Math.round(d/50)*50+' метров '+txt+name);}}
}
function cam(){
  const sp=state.speed*3.6;
  const z=sp<15?17.6:sp<45?16.8:sp<80?16:15.2;
  map.easeTo({center:state.pos,bearing:state.heading,pitch:62,zoom:z,duration:state.sim?260:950,easing:t=>t,
    padding:{top:Math.round(innerHeight*.42),bottom:0,left:0,right:0}});
}
/* если сдвинули карту пальцем, слежение отключается; кнопка локации включает его снова */
map.on('dragstart',e=>{if(e.originalEvent&&state.track!=='off'&&state.mode!=='preview')setTrack('off');});

$('#loc').onclick=()=>{
  if(!state.pos){toast('GPS ещё ищет сигнал');return;}
  if(state.mode==='nav'){setTrack('head');cam();return;}
  if(state.mode==='preview'){map.easeTo({center:state.pos,duration:600});return;}
  if(state.track==='off'){
    setTrack('north');
    map.easeTo({center:state.pos,zoom:Math.max(map.getZoom(),15.5),bearing:0,pitch:0,duration:700});
  }else if(state.track==='north'){
    setTrack('head');
    map.easeTo({center:state.pos,bearing:state.heading,pitch:55,zoom:Math.max(map.getZoom(),16.5),duration:700});
  }else{
    setTrack('north');
    map.easeTo({center:state.pos,bearing:0,pitch:0,duration:700});
  }
};

async function reroute(){
  if(!state.dest||!state.pos)return;
  state.rerouting=true;state.lastReroute=Date.now();
  toast('Перестраиваю маршрут');
  try{
    const r=await fetchRoute(state.pos,[state.dest.lng,state.dest.lat]);
    R=r;state.idx=0;state.spoken={};laneSig='';drawRoute(r);say('Маршрут перестроен');
  }catch(e){}
  state.rerouting=false;
}
let arrT=false;
function arrived(){
  if(arrT)return;arrT=true;
  say('Вы прибыли в пункт назначения');
  $('#mIcon').innerHTML=iconSVG({maneuver:{type:'arrive'}});
  $('#lanes').classList.remove('show');
  $('#mDist').textContent='0 м';$('#mText').textContent='Вы прибыли';$('#mStreet').textContent=state.dest?'▸ '+state.dest.name:'';
  setTimeout(()=>{arrT=false;if(state.mode==='nav')endNav();},5000);
}

/* ============ СИМУЛЯЦИЯ ============ */
let simTimer=null,simProg=0,simSeg=0;
function pointAt(d){
  const c=R.coords,cum=R.cum;
  while(simSeg<c.length-2&&cum[simSeg+1]<d)simSeg++;
  const l=cum[simSeg+1]-cum[simSeg]||1,t=Math.max(0,Math.min(1,(d-cum[simSeg])/l));
  return [c[simSeg][0]+(c[simSeg+1][0]-c[simSeg][0])*t,c[simSeg][1]+(c[simSeg+1][1]-c[simSeg][1])*t];
}
function startSim(){
  stopSim();simProg=0;simSeg=0;
  simTimer=setInterval(()=>{
    if(!R||state.mode!=='nav')return;
    simProg=Math.min(R.total,simProg+state.simSpeed*0.25);
    const p=pointAt(simProg),a=pointAt(Math.min(R.total,simProg+12));
    onFix(p[0],p[1],bearing(p,a),state.simSpeed,5);
  },250);
}
function stopSim(){if(simTimer){clearInterval(simTimer);simTimer=null;}}
$('#sim').onclick=()=>{
  state.sim=!state.sim;$('#sim').classList.toggle('on',state.sim);
  toast(state.sim?'Режим симуляции: вкл':'Режим симуляции: выкл');
  if(state.mode==='nav'){state.sim?startSim():stopSim();}
};
$('#spd').onclick=()=>{if(!state.sim)return;state.simSpeed=state.simSpeed===16?30:state.simSpeed===30?8:16;};

/* ============ КНОПКИ ============ */
$('#vox').onclick=()=>{state.voice=!state.voice;$('#vox').classList.toggle('on',state.voice);$('#vox').classList.toggle('off',!state.voice);if(!state.voice){try{speechSynthesis.cancel();}catch(e){}}else say('Голос включён');};

/* ============ ЗАГРУЗКА ============ */
setTimeout(()=>$('#boot').classList.add('hide'),2300);
</script>
